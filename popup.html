<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>书签权重管理器</title>
  <style>
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 12px;
      background-color: #f7f9fa;
      color: #333;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .settings-btn {
      font-size: 12px;
      color: #1a73e8;
      cursor: pointer;
      text-decoration: none;
    }
    .search-box {
      margin-bottom: 10px;
    }
    .search-box input {
      width: 100%;
      padding: 6px 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }
    .list-container {
      max-height: 350px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
    }
    .bookmark-item {
      padding: 8px 10px;
      border-bottom: 1px solid #eee;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .bookmark-item:last-child {
      border-bottom: none;
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-title {
      font-weight: 500;
      font-size: 13px;
      color: #1a0dab;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 250px;
    }
    .item-title:hover {
      text-decoration: underline;
    }
    .item-weight {
      background: #e8f0fe;
      color: #1967d2;
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: bold;
    }
    .item-url {
      font-size: 11px;
      color: #5f6368;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-actions {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }
    .action-btn {
      font-size: 11px;
      background: none;
      border: 1px solid #dadce0;
      border-radius: 3px;
      padding: 2px 6px;
      cursor: pointer;
      color: #3c4043;
    }
    .action-btn:hover {
      background: #f1f3f4;
    }
    .action-btn.delete {
      color: #d93025;
      border-color: #fad2cf;
    }
    .action-btn.delete:hover {
      background: #fce8e6;
    }
    .empty-tip {
      text-align: center;
      padding: 30px;
      color: #70757a;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h2>
    <span>书签权重清单 (降序)</span>
    <a class="settings-btn" id="openOptions">规则设置</a>
  </h2>
  
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索网址或标题以重写权重...">
  </div>

  <div class="list-container" id="listContainer">
    <div class="empty-tip">加载中...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
