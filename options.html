<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>权重规则设置 - 书签智能管理器</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      background: #f7f9fa;
      color: #333;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    h2 {
      margin-top: 0;
      color: #1a73e8;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 500;
      margin-bottom: 6px;
      font-size: 14px;
    }
    input[type="number"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .tip {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
    .save-btn {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
    }
    .save-btn:hover {
      background: #1557b0;
    }
    .status {
      margin-left: 10px;
      font-size: 13px;
      color: #34a853;
      display: none;
    }
  </style>
</head>
<body>
  <h2>扩展权重计数规则设置</h2>
  <div class="form-group">
    <label for="stayTimeMinutes">常驻浏览器时间阈值（分钟）</label>
    <input type="number" id="stayTimeMinutes" min="1" value="60">
    <div class="tip">当网址常驻浏览器达到该时间后触发加分。</div>
  </div>

  <div class="form-group">
    <label for="stayTimeBonus">常驻加分数值 (+)</label>
    <input type="number" id="stayTimeBonus" min="0" value="5">
    <div class="tip">满足常驻时间后增加的权重分（要求：加 5）。</div>
  </div>

  <div class="form-group">
    <label for="openCountBonus">重复打开每次加分数值 (+)</label>
    <input type="number" id="openCountBonus" min="0" value="1">
    <div class="tip">每次加载完成一个网址增加的权重分（要求：加 1）。</div>
  </div>

  <button class="save-btn" id="saveBtn">保存规则并立即生效</button>
  <span class="status" id="statusMsg">保存成功，规则已实时生效！</span>

  <script src="options.js"></script>
</body>
</html>
